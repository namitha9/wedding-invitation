<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Invitation</title><link rel="stylesheet" href="styles.css"></head><body><div id="opening" class="opening"><div class="envelope" id="envelope"><div class="flap"></div><div class="paper"><p>Together with their families</p><h1 id="openNames">Your Names</h1><p id="openDate">Your Wedding Date</p></div><button id="openButton" class="seal">OPEN</button></div><p class="tap">Tap the seal to open</p></div><main id="site" class="site hidden"><section class="hero"><p>Together with their families</p><h1><span id="bride"></span><br>&amp;<br><span id="groom"></span></h1><p id="date"></p><p id="venue"></p></section><section><p>THE CELEBRATIONS</p><div id="events" class="cards"></div></section><section><p>SAVE THE DATE</p><div id="countdown" class="countdown"></div></section><section><p>JOIN US</p><h2 id="locationName"></h2><p id="address"></p><a id="mapLink" class="button" target="_blank">View location</a></section><section class="rsvp"><p>RSVP</p><form id="rsvpForm"><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email"><select name="attendance" required><option value="">Attendance</option><option>Joyfully accepts</option><option>Regretfully declines</option></select><input name="guests" type="number" min="1" max="10" value="1"><select name="meal"><option value="">Meal preference</option><option>Vegetarian</option><option>Non-vegetarian</option><option>No preference</option></select><textarea name="message" placeholder="A message"></textarea><button class="button">Send RSVP</button><p id="rsvpStatus"></p></form></section><footer>With love ♡</footer></main><script src="config.js"></script><script src="app.js"></script></body></html>
